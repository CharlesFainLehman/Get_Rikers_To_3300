#This is the one that updates the site every time the new daily file is downloaded

name: daily_update
on:
  workflow_run:
    workflows: ["fetch_daily"]
    types:
      - completed
      
env:
    TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
    SECRET: ${{ secrets.SHINYAPPS_SECRET_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    # only deploy if the fetch actually succeeded; otherwise we'd push stale data
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
    - name: Did the fetch commit a new file?
      id: cmp
      env:
        FETCH_STARTED_AT: ${{ github.event.workflow_run.head_sha }}
      run: |
        # fetch_daily only commits when the file changed, so if main is still at the
        # commit that run started from there is nothing new to deploy
        if [ "$GITHUB_SHA" = "$FETCH_STARTED_AT" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No new data since the last deploy; skipping the deploy."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}

    steps:
    - uses: actions/checkout@v5
    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.2'
        use-public-rspm: true # prebuilt binaries instead of compiling from source
    #- uses: r-lib/actions/setup-r-dependencies@v2
    #  with:
    #    cache-version: 2
    #    extra-packages: |
    #      any::rsconnect
    #      any::shiny
    #      any::dplyr
    #      any::ggplot2
    - name: Install Curl
      run: sudo apt-get install libcurl4-openssl-dev
    - name: Install R libraries
      run: |
        # the default (Depends/Imports/LinkingTo) is all the app needs; dependencies=TRUE
        # also pulled in Suggests such as sf, which needs GDAL and fails to build here
        install.packages(c("rsconnect", "shiny", "dplyr", "ggplot2", "lifecycle", "scales"))
      shell: Rscript {0}
    - name: Push to site
      run: Rscript bin/upload_to_site.R "$TOKEN" "$SECRET"
